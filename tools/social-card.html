<!doctype html>
<html lang="en-GB" data-theme="light" data-scene="forest">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Social card</title>
<!-- The image shown when a page is shared. tools/render-social.sh opens this
     at 1200 × 630 with ?page=<slug> and saves a screenshot to og/<slug>.png.
     It reads the title, description and first drawing from the page itself,
     so a card never drifts from the page it describes. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=14"><link rel="stylesheet" href="/notes.css?v=3">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--reading-ink); }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .card { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 112px 72px 64px; }
  .band { position: absolute; inset: 0 0 auto; height: 64px; background: linear-gradient(var(--paper), color-mix(in srgb, var(--wood-mist) 28%, var(--paper))); }
  .band svg { width: 100%; height: 100%; opacity: .5; display: block; }
  .who { display: flex; align-items: center; gap: 14px; font: 500 20px/1 "DM Sans", sans-serif; }
  .who .monogram { width: 46px; height: 46px; font-size: 15px; }
  .copy { position: relative; z-index: 1; width: 600px; margin-top: 46px; }
  .kicker { margin: 0; font: 500 15px/1 "DM Sans", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--reading-muted); }
  h1 { margin: 20px 0 22px; font: 400 60px/1.1 "Lora", serif; letter-spacing: -.035em; text-wrap: balance; }
  .card.long h1 { font-size: 52px; }
  .summary { margin: 0; font: 400 24px/1.5 "Lora", serif; color: var(--reading-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .art { position: absolute; right: 56px; top: 150px; bottom: 90px; width: 470px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 18px 22px; }
  .art svg { width: 100%; height: auto; max-height: 100%; overflow: visible; }
  .art.pieces svg { width: 200px; }
  .site { position: absolute; left: 72px; bottom: 54px; font: 500 16px/1 "DM Sans", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--reading-muted); }
  .bet-high { opacity: 0; }
</style>
</head>
<body class="notes-page">
<div class="card">
  <div class="band" aria-hidden="true"><svg viewBox="0 0 1600 100" preserveAspectRatio="none"><path d="M0 60Q220 0 480 65T1000 40T1600 55V100H0Z" fill="var(--wood-far)"/><path d="M0 85Q300 20 650 85T1300 65T1600 80V100H0Z" fill="var(--wood-pine)"/><path d="m95 100 22-76 22 76m8 0 17-54 17 54m1220 0 24-82 24 82m-77 0 19-60 19 60" fill="var(--wood-deep)"/></svg></div>
  <div class="who"><span class="monogram">DJ</span>David Jones</div>
  <div class="copy">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="summary" id="summary"></p>
  </div>
  <div class="art" id="art"></div>
  <div class="site">dejones.io</div>
</div>
<script>
(async () => {
  const page = new URLSearchParams(location.search).get("page") || "notes";
  const doc = new DOMParser().parseFromString(await (await fetch(`/${page}/`)).text(), "text/html");
  const title = doc.querySelector("h1").textContent.trim();
  const card = document.querySelector(".card");
  document.getElementById("title").textContent = title;
  if (title.length > 34) card.classList.add("long");
  document.getElementById("summary").textContent = doc.querySelector('meta[name="description"]').content;
  const kicker = { notes: "Notes", about: "About", projects: "Projects" }[page]
    || (doc.querySelector(".value-entry") ? "Reference" : "Note");
  document.getElementById("kicker").textContent = kicker;

  // The first drawing on the page, or a handful of the reference entries'.
  const art = document.getElementById("art");
  const pieces = [...doc.querySelectorAll(".value-art")];
  if (pieces.length) {
    art.classList.add("pieces");
    for (const index of [0, 4, 3, 6]) if (pieces[index]) art.append(document.importNode(pieces[index], true));
  } else {
    // The notes list has no drawing of its own, so it borrows the first
    // note's.
    let figure = doc.querySelector(".note-figure svg");
    if (!figure) {
      const first = doc.querySelector(".note-index-link")?.getAttribute("href");
      if (first) figure = new DOMParser().parseFromString(await (await fetch(first)).text(), "text/html").querySelector(".note-figure svg");
    }
    if (figure) art.append(document.importNode(figure, true));
  }
  await document.fonts.ready;
  document.body.dataset.ready = "true";
})();
</script>
</body>
</html>
