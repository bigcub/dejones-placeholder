<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Touch icon</title>
<!-- The site icon at 180 × 180 on a square, opaque ground, for phones'
     home screens. tools/render-social.sh saves it to apple-touch-icon.png. -->
<style>
  html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; background: #25261f; }
  img { display: block; width: 180px; height: 180px; }
</style>
</head>
<body><img src="/favicon.svg" alt=""></body>
</html>
