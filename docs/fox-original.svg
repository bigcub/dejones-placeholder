<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -30 190 90" width="570" height="270">
  <!-- The original meadow fox, kept as a backup after the slimmer redraw.
       In the scene it trots along .fox-route (keyframes fox-cross in
       styles.css) with the fox-step, fox-stride and fox-tail-sway
       animations below. To restore it, replace the .fox group in index.html
       with this one and use a single leg origin of 40px 25px. -->
  <style>
    .fox { animation: fox-step .72s ease-in-out infinite alternate; }
    .fox-body, .fox-head, .fox-tail { fill: url(#foxCoat); }
    .fox-cream { fill: #f5dfb6; }
    .fox-rust { fill: #b76236; }
    .fox-haunch { fill: #dc8c4b; opacity: .55; }
    .fox-ear { fill: #a35132; }
    .fox-inner-ear { fill: #492e2c; }
    .fox-leg-far { fill: #88432f; }
    .fox-sock, .fox-eye, .fox-nose { fill: #392d2d; }
    .fox-leg { transform-origin: 40px 25px; animation: fox-stride .72s ease-in-out infinite alternate; }
    .fox-leg-hind, .fox-leg-front-far { animation-direction: alternate-reverse; }
    .fox-tail-sway { transform-origin: 15px 21px; animation: fox-tail-sway 1.44s ease-in-out infinite alternate; }
    @keyframes fox-step { from { transform: translateY(0) rotate(0); } to { transform: translateY(-3px) rotate(-1deg); } }
    @keyframes fox-stride { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
    @keyframes fox-tail-sway { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="-70" y="-30" width="190" height="90" fill="#dfe3c8"/>
  <g class="fox">
    <defs>
      <linearGradient id="foxCoat" x1="0" y1="0" x2=".4" y2="1">
        <stop stop-color="#e7a05c" />
        <stop offset=".5" stop-color="#c7753e" />
        <stop offset="1" stop-color="#93472f" />
      </linearGradient>
    </defs>
    <g class="fox-tail-sway">
      <path class="fox-tail" d="M20 17C0 7-10-7-29-5c-12 1-21 8-31 9 10 5 12 18 28 23 17 6 36 1 52-1Z" />
      <path class="fox-cream" d="M-60 4c10-1 19-8 31-9l-5 8 10 1-8 6 9 4-11 4 5 8C-47 20-50 9-60 4Z" />
    </g>
    <g class="fox-leg fox-leg-back">
      <path class="fox-leg-far" d="M27 24 36 35 29 48h-9l9-16-12-5Z" />
      <path class="fox-sock" d="m26 39 6 3-3 6H19l2-4 3-1Z" />
    </g>
    <g class="fox-leg fox-leg-front-far">
      <path class="fox-leg-far" d="M56 24h8l3 21 6 3H61l-4-14Z" />
      <path class="fox-sock" d="m60 39 7-1v7l6 3H61Z" />
    </g>
    <path class="fox-body" d="M7 24C4 10 16 3 31 5c13 1 22 6 31 1l10 15-9 13c-14 1-21-7-33-4L13 34Z" />
    <path class="fox-haunch" d="M12 14c10-8 24-2 23 8-1 8-10 10-18 10l-6-6Z" />
    <g class="fox-leg fox-leg-hind">
      <path class="fox-rust" d="M17 24c9-1 13 4 10 10l-9 8-1 7H7l3-13Z" />
      <path class="fox-sock" d="m11 39 8 1-2 9H6l1-4 3-1Z" />
    </g>
    <path class="fox-cream" d="m59 9 14 8-4 14-8 7-1-9-6 1 3-8-5-1Z" />
    <g class="fox-leg fox-leg-front">
      <path class="fox-rust" d="m63 25 8-3-3 16 1 11H58l1-4 3-1-1-9Z" />
      <path class="fox-sock" d="m62 38 6-1 1 12H58l1-4 3-1Z" />
    </g>
    <path class="fox-ear" d="m67 4-3-21c11 4 16 12 17 17Z" />
    <path class="fox-head" d="m58 9 9-12 15-2 10 12 17 6-12 9-17 3-10-5-12 2 4-7-8-1Z" />
    <path class="fox-ear" d="m79 1 5-22c10 6 12 16 9 27Z" />
    <path class="fox-inner-ear" d="m84-2 2-12 5 16Z" />
    <path class="fox-cream" d="m78 14 11 1 15-2-7 9-17 3-10-5Z" />
    <path class="fox-eye" d="m87 8 5 1-3 2-3-1Z" />
    <path class="fox-nose" d="m103 11 7 2-5 4-3-2Z" />
  </g>
</svg>
