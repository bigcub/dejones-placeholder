<style>
/* Braemar in winter: a snowbound cabin between bare birches, snowy pines and
   the Cairngorm ridges. Pale daylight by day, blue moonlit snow by night;
   the cabin stays warmly lit in both. */
:root {
  --w-sky-top: #95abc4; --w-sky-mid: #cdd9e4; --w-sky-low: #efe9e1; --w-sun: #fff6e6;
  --w-mountain: #b7c4d3; --w-mountain-shade: #8e9fb6; --w-snowcap: #f4f6f8;
  --w-pine-far: #7a9186; --w-pine-near: #3f5f50; --w-snow: #f3f5f7; --w-snow-shade: #c5d2e1; --w-snow-deep: #a7b8cd;
  --w-log: #7a5238; --w-log-dark: #5a3a28; --w-roof-snow: #fbfcfd; --w-stone: #8a8583;
  --w-birch: #e9e4da; --w-birch-mark: #3b3634; --w-birch-branch: #6b5552; --w-fence: #6b513d;
  --w-wood-end: #c1946a; --w-wood-ring: #6d4a32;
}
[data-theme="dark"] {
  --w-sky-top: #0b1530; --w-sky-mid: #1b2c55; --w-sky-low: #3c5480; --w-sun: #eef0f6;
  --w-mountain: #2b4068; --w-mountain-shade: #1c2c4d; --w-snowcap: #8ea3c8;
  --w-pine-far: #1d3044; --w-pine-near: #10213a; --w-snow: #9fb4d6; --w-snow-shade: #6c84ad; --w-snow-deep: #4d6591;
  --w-log: #3b2c33; --w-log-dark: #261d25; --w-roof-snow: #b3c4e0; --w-stone: #343648;
  --w-birch: #8e9cb8; --w-birch-mark: #1d2233; --w-birch-branch: #1e2438; --w-fence: #2d2831;
  --w-wood-end: #4a3d44; --w-wood-ring: #261d25;
}
.scene-winter, .winter-icon { visibility: hidden; opacity: 0; }
.winter-icon { transform: translateY(18px); }
.coordinate-winter { display: none; }
[data-scene="winter"] .scene-meadow, [data-scene="winter"] .scene-ocean, [data-scene="winter"] .scene-tarn, [data-scene="winter"] .scene-forest, [data-scene="winter"] .scene-desert, [data-scene="winter"] .scene-canal { visibility: hidden; opacity: 0; }
[data-scene="winter"] .scene-winter { visibility: visible; opacity: 1; }
[data-scene="winter"] .hills-icon, [data-scene="winter"] .waves-icon, [data-scene="winter"] .mountain-icon, [data-scene="winter"] .forest-icon, [data-scene="winter"] .desert-icon, [data-scene="winter"] .canal-icon { opacity: 0; transform: translateY(-18px); }
[data-scene="winter"] .winter-icon { visibility: visible; opacity: 1; transform: translateY(0); }
[data-scene="winter"] .coordinate-meadow, [data-scene="winter"] .coordinate-ocean, [data-scene="winter"] .coordinate-tarn, [data-scene="winter"] .coordinate-forest, [data-scene="winter"] .coordinate-desert, [data-scene="winter"] .coordinate-canal { display: none; }
[data-scene="winter"] .coordinate-winter { display: block; }
/* The cream caption disappears against daylight snow, so use slate blue. */
:root:not([data-theme="dark"])[data-scene="winter"] .scene-coordinate { color: #5b6d84; text-shadow: none; }

.winter-sun { transition: translate .8s ease; }
[data-theme="dark"] .winter-sun { translate: 0 -130px; }
.winter-ridge { fill: var(--w-mountain); }
.winter-caps { fill: var(--w-snowcap); }
.winter-ridge-shade { fill: var(--w-mountain-shade); opacity: .45; }
.winter-hill { fill: color-mix(in srgb, var(--w-snow-shade) 70%, var(--w-mountain)); }
.winter-hill-shade { fill: var(--w-snow-deep); opacity: .35; }
/* Two rows of tiered pines, the far row softened by distance, each tier
   carrying a line of snow. */
.winter-pines.far { fill: var(--w-pine-far); }
.winter-pines.near { fill: var(--w-pine-near); }
.winter-pine-snow { fill: var(--w-snowcap); }
.winter-pines.far .winter-pine-snow { opacity: .85; }
.winter-trunks { fill: var(--w-log-dark); opacity: .7; }
.winter-footprints { fill: var(--w-snow-deep); opacity: .55; }

/* The cabin: logs, a thick overhang of roof snow, and warm windows. */
.winter-cabin-shadow { fill: var(--w-snow-deep); opacity: .35; }
.winter-spill { fill: var(--window); opacity: .12; transition: opacity .8s ease; }
[data-theme="dark"] .winter-spill { opacity: .5; }
.winter-log { fill: var(--w-log); }
.winter-log-dark { fill: var(--w-log-dark); }
.winter-log-lines { fill: none; stroke: var(--w-log-dark); stroke-width: 1.4; opacity: .55; }
.winter-log-lines.side { opacity: .4; }
.winter-log-ends { fill: none; stroke: color-mix(in srgb, var(--w-log) 70%, var(--w-wood-end)); stroke-width: 9; stroke-linecap: round; }
.winter-roof-side { fill: color-mix(in srgb, var(--w-roof-snow) 82%, var(--w-snow-deep)); }
.winter-chimney { fill: var(--w-stone); }
.winter-roof-snow { fill: none; stroke: var(--w-roof-snow); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
.winter-chimney-snow { fill: none; stroke: var(--w-roof-snow); stroke-width: 8; stroke-linecap: round; }
.winter-roof-snow-shade { fill: none; stroke: var(--w-snow-shade); stroke-width: 4; stroke-linecap: round; opacity: .7; }
.winter-window, .winter-lantern { fill: var(--window); }
.winter-window-glow { fill: var(--window); opacity: .25; transition: opacity .8s ease; }
[data-theme="dark"] .winter-window-glow { opacity: .6; animation: window-flicker 7s ease-in-out infinite; }
.winter-frame { fill: none; stroke: var(--w-log-dark); stroke-width: 2; }
.winter-door { fill: var(--w-log-dark); }
.winter-knob { fill: var(--window); }
.winter-sill-snow { fill: none; stroke: var(--w-roof-snow); stroke-width: 5; stroke-linecap: round; }
.winter-lantern-glow { fill: var(--window); opacity: .3; transition: opacity .8s ease; }
[data-theme="dark"] .winter-lantern-glow { opacity: .8; animation: window-flicker 5s ease-in-out infinite; }
.winter-drift-base { fill: var(--w-snow); }
.winter-wood circle { fill: var(--w-wood-end); stroke: var(--w-wood-ring); stroke-width: 1.2; }
.winter-smoke path { fill: none; stroke: color-mix(in srgb, var(--w-snow-shade) 70%, transparent); stroke-width: 6; stroke-linecap: round; opacity: .5; animation: smoke 5s ease-in-out infinite alternate; }
.winter-smoke .late { animation-delay: 2.5s; opacity: .35; }

.winter-birch-trunk { fill: var(--w-birch); }
.winter-birch-marks { fill: none; stroke: var(--w-birch-mark); stroke-width: 2.2; stroke-linecap: round; }
.winter-birch-branches path { fill: none; stroke: var(--w-birch-branch); stroke-linecap: round; }
.winter-branch-snow { fill: none; stroke: var(--w-roof-snow); stroke-width: 1.6; stroke-linecap: round; opacity: .9; }

/* Drifts carry lit crests and shaded lee faces, like the desert's dunes. */
.winter-lee { fill: url(#winterLee); opacity: .85; }
.winter-rim { fill: none; stroke: var(--w-sun); stroke-width: 2.6; stroke-linecap: round; opacity: .8; }
.winter-post { fill: none; stroke: var(--w-fence); stroke-width: 6; stroke-linecap: round; }
.winter-rail { fill: none; stroke: var(--w-fence); stroke-width: 3; }
.winter-post-snow { fill: none; stroke: var(--w-roof-snow); stroke-width: 5; stroke-linecap: round; }
.winter-sparkles { fill: none; stroke: #fff; stroke-width: 1.2; stroke-linecap: round; }
.winter-sparkles path { opacity: 0; animation: winter-sparkle 4.6s ease-in-out infinite; }
.winter-sparkles path:nth-child(3n) { animation-delay: 1.5s; }
.winter-sparkles path:nth-child(3n+1) { animation-delay: 3.1s; }
